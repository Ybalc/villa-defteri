name: Yayınla ve APK oluştur

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: build
  cancel-in-progress: true

jobs:
  web:
    name: Web sürümü (GitHub Pages)
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: www
      - id: deploy
        uses: actions/deploy-pages@v4

  apk:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Bağımlılıklar
        run: npm install
      - name: Android projesi
        run: |
          npx cap add android
          npx cap sync android
      - name: APK derle
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon
      - name: Dosya adı
        run: cp android/app/build/outputs/apk/debug/app-debug.apk VillaDefteri.apk
      - name: Son sürüm olarak yayınla
        uses: softprops/action-gh-release@v2
        with:
          tag_name: son-surum
          name: Villa Defteri – son sürüm
          body: "Telefonunuza bu sayfadaki VillaDefteri.apk dosyasını indirip kurun. Commit: ${{ github.sha }}"
          files: VillaDefteri.apk
          make_latest: true
